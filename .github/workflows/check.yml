name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  schedule:
    uses: ./.github/workflows/schedule-runner.yml

  check:
    needs: schedule
    runs-on: [self-hosted, "${{ needs.schedule.outputs.runner-label }}"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: nix flake check --all-systems --no-build
      - run: nix flake check
